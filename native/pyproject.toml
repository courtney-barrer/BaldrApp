[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "baldrapp-simulator-native"
version = "0.1.9"
description = "Precompiled Linux x86-64 helpers for the BaldrApp Paranal simulator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Operating System :: POSIX :: Linux"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
